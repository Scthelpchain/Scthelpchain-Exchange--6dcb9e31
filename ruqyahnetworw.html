<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ruqyah Ash-Shari'ah Global Network</title>
    <style>
        body { 
            background: linear-gradient(135deg, #0a0e17, #1a2a40); 
            color: #d4af37; 
            font-family: 'Segoe UI', serif; 
            padding: 50px; 
            text-align: center;
        }
        .card { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 50px; 
            border-radius: 20px; 
            border: 1px solid #d4af37; 
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); 
            max-width: 800px; 
            margin: auto;
        }
        h1 { color: #ffffff; text-shadow: 0 0 15px #d4af37; }
        p { color: #e0e0e0; font-size: 1.2rem; }
        .btn { 
            display: inline-block; 
            padding: 18px 40px; 
            background: #d4af37; 
            color: #000; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 50px; 
            transition: 0.3s;
        }
        .btn:hover { background: #ffffff; box-shadow: 0 0 20px #ffffff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Ruqyah Ash-Shari'ah Global Network</h1>
        <p>A journey towards spiritual peace and healing in the light of the Quran.</p>
        <hr style="border: 0; height: 1px; background: #d4af37;">
        <br>
        <p>Advisor: <strong>Hero H R Antor</strong></p>
        <br>
        <a href="#" class="btn">Get Started</a>
    </div>
</body>
</html>
